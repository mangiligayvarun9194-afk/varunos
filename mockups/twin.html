<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sarathi — Twin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#0a0c12; padding:48px 24px; font-family:'Space Grotesk','Inter',sans-serif; }
  .ti { font-family:'tabler-icons' !important; }
</style>
</head>
<body>
  <div style="width: 332px; background:#06080d; border-radius: 40px; border: 8px solid #15171d; box-shadow: 0 0 0 2px #2a2d36, 0 24px 60px -20px rgba(0,0,0,.7); overflow:hidden;">

    <div style="height:34px; display:flex; align-items:center; justify-content:space-between; padding:0 22px; color:#eef2ff; font-size:12px; font-weight:500;">
      <span>9:41</span>
      <span style="display:flex; gap:5px; align-items:center;"><i class="ti ti-signal-4g" style="font-size:14px"></i><i class="ti ti-wifi" style="font-size:14px"></i><i class="ti ti-battery-3" style="font-size:15px"></i></span>
    </div>

    <div style="display:flex; align-items:center; justify-content:space-between; padding:6px 18px 12px;">
      <span style="font-size:18px; font-weight:700; color:#eef2ff;">Sarathi</span>
      <span style="display:flex; align-items:center; gap:8px;">
        <span style="display:flex; align-items:center; gap:5px; font-size:10px; font-weight:600; color:#59648a; border:1px solid rgba(148,163,196,.18); border-radius:999px; padding:3px 9px;"><span style="width:6px;height:6px;border-radius:50%;background:#34d399; box-shadow:0 0 7px #34d399;"></span>connected</span>
        <span style="width:30px;height:30px;border-radius:9px;background:#2ee6a8;color:#04150e;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;">V</span>
      </span>
    </div>

    <div style="padding:0 18px;">
      <div style="font-size:24px; font-weight:700; color:#f2f5fc; letter-spacing:-.02em;">Your Twin</div>
      <div style="font-size:12px; color:#8e9ab8; margin-bottom:12px;">Trains when you train. Grows when you grow.</div>
    </div>

    <div style="position:relative; margin:0 14px; border-radius:18px; height:300px; overflow:hidden; background:radial-gradient(ellipse at 50% 30%, #112038 0%, #06080d 78%); border:1px solid rgba(148,163,196,.12);">
      <div style="position:absolute; top:12px; left:12px; z-index:2; display:flex; align-items:center; gap:7px; background:rgba(8,11,18,.7); border:1px solid rgba(148,163,196,.16); border-radius:999px; padding:5px 11px;">
        <i class="ti ti-bolt" style="color:#2ee6a8; font-size:13px;"></i>
        <span style="font-size:12px; font-weight:700; color:#eef2ff;">LV 42</span>
        <span style="font-size:11px; color:#8e9ab8;">Forged</span>
      </div>
      <svg viewBox="0 0 200 300" width="100%" height="300" style="position:absolute; inset:0;">
        <defs>
          <filter id="g" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <g filter="url(#g)" stroke="#2ee6a8" stroke-linecap="round" fill="none">
          <path d="M70 96 L52 150 L48 196" stroke-width="13" opacity=".95"/>
          <path d="M130 96 L148 150 L152 196" stroke-width="13" opacity=".95"/>
          <path d="M88 168 L82 232 L80 292" stroke-width="16" opacity=".95"/>
          <path d="M112 168 L118 232 L120 292" stroke-width="16" opacity=".95"/>
        </g>
        <g filter="url(#g)">
          <circle cx="100" cy="34" r="17" fill="#2ee6a8" opacity=".9"/>
          <path d="M64 60 Q100 50 136 60 L122 150 Q100 160 78 150 Z" fill="#2ee6a8" opacity=".22" stroke="#2ee6a8" stroke-width="2"/>
          <circle cx="68" cy="70" r="15" fill="#2ee6a8" opacity=".8"/>
          <circle cx="132" cy="70" r="15" fill="#2ee6a8" opacity=".8"/>
          <ellipse cx="85" cy="92" rx="15" ry="11" fill="#2ee6a8" opacity=".55"/>
          <ellipse cx="115" cy="92" rx="15" ry="11" fill="#2ee6a8" opacity=".55"/>
          <path d="M82 152 L118 152 L122 170 L78 170 Z" fill="#2ee6a8" opacity=".4"/>
        </g>
      </svg>
    </div>

    <div style="display:flex; gap:5px; margin:12px 14px; background:#0c0f17; border:1px solid rgba(148,163,196,.12); border-radius:15px; padding:5px;">
      <div style="flex:1; text-align:center; padding:8px 0; font-size:12px; color:#8e9ab8; font-weight:600;">Idle</div>
      <div style="flex:1; text-align:center; padding:8px 0; font-size:12px; color:#8e9ab8; font-weight:600;">Squat</div>
      <div style="flex:1; text-align:center; padding:8px 0; font-size:12px; color:#8e9ab8; font-weight:600;">Press</div>
      <div style="flex:1; text-align:center; padding:8px 0; font-size:12px; color:#04150e; font-weight:700; background:#2ee6a8; border-radius:11px;">PR!</div>
    </div>

    <div style="margin:0 14px 14px; background:rgba(17,24,44,.66); border:1px solid rgba(148,163,196,.14); border-radius:16px; padding:15px;">
      <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;">
        <span style="font-size:16px; font-weight:700; color:#f2f5fc;">Level 42</span>
        <span style="font-size:12px; color:#8e9ab8;">Forged</span>
      </div>
      <div style="height:7px; border-radius:6px; background:rgba(255,255,255,.06); overflow:hidden; margin-bottom:14px;"><div style="width:62%; height:100%; border-radius:6px; background:linear-gradient(90deg,#2ee6a8,#4cc9f0);"></div></div>
      <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:8px;">
        <div style="text-align:center; background:#121624; border:1px solid rgba(148,163,196,.12); border-radius:13px; padding:11px 4px;">
          <i class="ti ti-trending-up" style="color:#34d399; font-size:15px;"></i>
          <div style="font-size:16px; font-weight:700; color:#34d399;">+6.2%</div>
          <div style="font-size:9px; color:#59648a; letter-spacing:.06em; font-weight:700;">VOLUME / WK</div>
        </div>
        <div style="text-align:center; background:#121624; border:1px solid rgba(148,163,196,.12); border-radius:13px; padding:11px 4px;">
          <i class="ti ti-flame" style="color:#2ee6a8; font-size:15px;"></i>
          <div style="font-size:16px; font-weight:700; color:#2ee6a8;">11</div>
          <div style="font-size:9px; color:#59648a; letter-spacing:.06em; font-weight:700;">WEEK STREAK</div>
        </div>
        <div style="text-align:center; background:#121624; border:1px solid rgba(148,163,196,.12); border-radius:13px; padding:11px 4px;">
          <i class="ti ti-bolt" style="color:#4cc9f0; font-size:15px;"></i>
          <div style="font-size:16px; font-weight:700; color:#4cc9f0;">2d</div>
          <div style="font-size:9px; color:#59648a; letter-spacing:.06em; font-weight:700;">LAST PR</div>
        </div>
      </div>
    </div>

    <div style="display:flex; justify-content:space-around; padding:10px 8px 18px; border-top:1px solid rgba(148,163,196,.1); margin:0 6px;">
      <span style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#59648a;font-size:9px;font-weight:600;"><i class="ti ti-sun" style="font-size:20px"></i>Today</span>
      <span style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#59648a;font-size:9px;font-weight:600;"><i class="ti ti-plus" style="font-size:20px"></i>Log</span>
      <span style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#2ee6a8;font-size:9px;font-weight:700;"><i class="ti ti-body-scan" style="font-size:20px"></i>Twin</span>
      <span style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#59648a;font-size:9px;font-weight:600;"><i class="ti ti-activity" style="font-size:20px"></i>Insights</span>
      <span style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#59648a;font-size:9px;font-weight:600;"><i class="ti ti-message" style="font-size:20px"></i>Coach</span>
    </div>

  </div>
</body>
</html>
